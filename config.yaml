environment:
  name: metadrive
  seed: 2037
  render: false
  use_render: false
  manual_control: false
  traffic_density: 0.1
  target_speed_kmh: 40.0
  max_episode_seconds: 180
  horizon: 1000

rl:
  algorithm: SAC
  policy: MlpPolicy
  learning_rate: 0.0003
  batch_size: 256
  gamma: 0.99
  buffer_size: 50000
  total_timesteps: 50000

llm:
  backend: ollama
  model: qwen2.5:7b
  ollama_url: http://localhost:11434/api/generate
  lmstudio_url: http://localhost:1234/v1/chat/completions
  decision_frequency_hz: 1.0
  temperature: 0.1
  max_tokens: 150

evaluation:
  target_speed_kmh: 40.0
  max_episode_seconds: 180
  test_seeds_file: experiments/seeds/test_seeds.json
  train_seeds_file: experiments/seeds/train_seeds.json
  val_seeds_file: experiments/seeds/validation_seeds.json
