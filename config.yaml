environment:
  backend: 2d
  name: driving_2d
  seed: 2037
  render: false
  lane_width_m: 3.5
  route_length_m: 500
  target_speed_kmh: 40.0
  horizon: 1000

rl:
  algorithm: SAC
  policy: MlpPolicy
  learning_rate: 0.0003
  batch_size: 256
  gamma: 0.99
  buffer_size: 50000
  total_timesteps: 50000

reward_weights:
  w_progress: 1.0
  w_lane: 1.5
  w_speed: 1.0
  w_safety: 1.0
  w_task: 10.0
  crash_penalty: -10.0
  out_of_road_penalty: -10.0
  progress_bonus: 2.0
  steering_penalty: -0.1

llm:
  backend: ollama
  model: qwen2.5:7b
  ollama_url: http://localhost:11434/api/generate
  lmstudio_url: http://localhost:1234/v1/chat/completions
  decision_frequency_hz: 1.0
  temperature: 0.1
  max_tokens: 150

evaluation:
  target_speed_kmh: 40.0
  horizon: 1000
  test_seeds_file: experiments/seeds/test_seeds.json
  train_seeds_file: experiments/seeds/train_seeds.json
  val_seeds_file: experiments/seeds/validation_seeds.json
